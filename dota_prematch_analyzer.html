<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dota Pro Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#08090c;--s1:#0e1118;--s2:#141820;--border:#1e2535;
  --t1:#4fc3f7;--t1d:#0277bd;--t2:#ef5350;--t2d:#b71c1c;
  --gold:#ffd54f;--green:#69f0ae;--muted:#4a5568;--text:#cdd6f4;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;--display:'Bebas Neue',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(79,195,247,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(79,195,247,0.03) 1px,transparent 1px);
  background-size:40px 40px;
}
.page{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:32px 20px 80px;}

/* HEADER */
header{text-align:center;margin-bottom:40px;}
.logo{
  font-family:var(--display);font-size:clamp(32px,6vw,56px);letter-spacing:4px;
  background:linear-gradient(135deg,var(--t1) 0%,#fff 50%,var(--t2) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:6px;
}
.sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}

/* SECTION TITLE */
.sec-title{
  font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--muted);
  text-transform:uppercase;margin-bottom:10px;padding-left:2px;
  display:flex;align-items:center;gap:8px;
}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* TEAM ROW */
.team-row{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin-bottom:28px;}
.team-box{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
.team-box.t1{border-left:3px solid var(--t1);}
.team-box.t2{border-left:3px solid var(--t2);}
.team-box label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:2px;display:block;margin-bottom:6px;}
.team-box input{width:100%;background:transparent;border:none;outline:none;font-family:var(--sans);font-size:18px;font-weight:600;}
.team-box.t1 input{color:var(--t1);}
.team-box.t2 input{color:var(--t2);}
.vs-badge{font-family:var(--display);font-size:22px;letter-spacing:3px;color:var(--muted);text-align:center;}

/* FACTORS */
.factors-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px;}
.factor-panel{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:18px;}
.factor-panel.t1{border-top:2px solid var(--t1);}
.factor-panel.t2{border-top:2px solid var(--t2);}
.panel-head{font-family:var(--mono);font-size:11px;letter-spacing:2px;margin-bottom:14px;}
.factor-panel.t1 .panel-head{color:var(--t1);}
.factor-panel.t2 .panel-head{color:var(--t2);}
.field{margin-bottom:10px;}
.field label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1px;display:block;margin-bottom:4px;}
.field select{
  width:100%;padding:8px 10px;background:var(--s2);border:1px solid var(--border);
  border-radius:6px;color:var(--text);font-family:var(--mono);font-size:12px;cursor:pointer;transition:border-color .2s;
}
.factor-panel.t1 .field select:focus{outline:none;border-color:var(--t1);}
.factor-panel.t2 .field select:focus{outline:none;border-color:var(--t2);}

/* HERO PICKS */
.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px;}
.pick-panel{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:18px;}
.pick-panel.t1{border-top:2px solid var(--t1);}
.pick-panel.t2{border-top:2px solid var(--t2);}
.pick-panel .panel-head{font-family:var(--mono);font-size:11px;letter-spacing:2px;margin-bottom:12px;}
.pick-panel.t1 .panel-head{color:var(--t1);}
.pick-panel.t2 .panel-head{color:var(--t2);}
.hero-inputs{display:flex;flex-direction:column;gap:8px;}

/* HERO ROW + AUTOCOMPLETE */
.hero-row{display:flex;gap:8px;align-items:center;}
.ac-wrap{flex:1;position:relative;}
.ac-wrap input{
  width:100%;padding:7px 10px;background:var(--s2);border:1px solid var(--border);
  border-radius:6px;color:var(--text);font-family:var(--mono);font-size:12px;transition:border-color .2s;
}
.pick-panel.t1 .ac-wrap input:focus{outline:none;border-color:var(--t1);}
.pick-panel.t2 .ac-wrap input:focus{outline:none;border-color:var(--t2);}
.ac-drop{
  position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:300;
  background:#0d1117;border:1px solid var(--border);border-radius:6px;
  max-height:210px;overflow-y:auto;display:none;
  box-shadow:0 12px 40px rgba(0,0,0,.8);
}
.ac-drop.open{display:block;}
.ac-item{
  padding:8px 12px;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--text);
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid rgba(30,37,53,.6);transition:background .1s;
}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover,.ac-item.sel{background:var(--s2);}
.ac-item b{color:var(--gold);font-weight:600;}
.ac-role{font-size:10px;color:var(--muted);}
.hero-wr{min-width:56px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted);}
.hero-phase{
  min-width:52px;text-align:center;font-family:var(--mono);font-size:10px;
  padding:2px 6px;border-radius:4px;background:var(--s2);color:var(--muted);border:1px solid var(--border);
}

/* FETCH BTN */
.fetch-btn{
  margin-top:10px;width:100%;padding:8px;background:transparent;border:1px solid var(--border);
  border-radius:6px;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:2px;
  cursor:pointer;transition:all .2s;
}
.pick-panel.t1 .fetch-btn:hover{border-color:var(--t1);color:var(--t1);}
.pick-panel.t2 .fetch-btn:hover{border-color:var(--t2);color:var(--t2);}
.fetch-status{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:6px;min-height:14px;}

/* ANALYZE BTN */
.analyze-wrap{text-align:center;margin:8px 0 32px;}
.analyze-btn{
  padding:16px 60px;background:transparent;border:1px solid var(--t1);border-radius:8px;
  font-family:var(--display);font-size:22px;letter-spacing:4px;color:var(--t1);
  cursor:pointer;transition:all .25s;position:relative;overflow:hidden;
}
.analyze-btn::before{
  content:'';position:absolute;inset:0;background:var(--t1);
  transform:scaleX(0);transform-origin:left;transition:transform .25s ease;
}
.analyze-btn:hover::before{transform:scaleX(1);}
.analyze-btn:hover{color:var(--bg);}
.analyze-btn span{position:relative;z-index:1;}

/* RESULTS */
#results{display:none;}

/* WIN PROB */
.winprob-row{display:grid;grid-template-columns:1fr 60px 1fr;gap:12px;align-items:center;margin-bottom:16px;}
.winprob-card{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:24px;text-align:center;}
.winprob-card.t1{border-top:3px solid var(--t1);}
.winprob-card.t2{border-top:3px solid var(--t2);}
.wpc-team{font-family:var(--mono);font-size:10px;letter-spacing:3px;margin-bottom:10px;}
.winprob-card.t1 .wpc-team{color:var(--t1);}
.winprob-card.t2 .wpc-team{color:var(--t2);}
.wpc-pct{font-family:var(--display);font-size:64px;letter-spacing:2px;line-height:1;}
.winprob-card.t1 .wpc-pct{color:var(--t1);}
.winprob-card.t2 .wpc-pct{color:var(--t2);}
.wpc-label{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:8px;}
.wpc-verdict{display:inline-block;margin-top:12px;padding:4px 16px;border-radius:20px;font-family:var(--mono);font-size:11px;letter-spacing:1px;}
.v-strong{background:rgba(105,240,174,.1);color:var(--green);border:1px solid rgba(105,240,174,.3);}
.v-slight{background:rgba(255,213,79,.1);color:var(--gold);border:1px solid rgba(255,213,79,.3);}
.v-even{background:rgba(74,85,104,.2);color:var(--muted);border:1px solid var(--border);}
.v-under{background:rgba(239,83,80,.1);color:var(--t2);border:1px solid rgba(239,83,80,.3);}
.winprob-vs{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center;}

/* WIN BAR */
.winbar-wrap{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:24px;}
.winbar-lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;margin-bottom:8px;}
.winbar-track{height:12px;background:var(--s2);border-radius:6px;overflow:hidden;display:flex;}
.wb-t1{height:100%;background:linear-gradient(90deg,var(--t1d),var(--t1));transition:width .8s ease;}
.wb-t2{height:100%;background:linear-gradient(90deg,var(--t2d),var(--t2));transition:width .8s ease;}

/* GAME PLAN */
.gameplan-panel{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:22px;margin-bottom:20px;}
.gameplan-panel h3{font-family:var(--display);font-size:20px;letter-spacing:3px;color:var(--gold);margin-bottom:18px;}
.phase-timeline{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px;}
.phase-block{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center;}
.ph-label{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:8px;}
.ph-time{font-family:var(--display);font-size:16px;color:var(--text);margin-bottom:10px;}
.ph-adv{font-family:var(--display);font-size:18px;letter-spacing:1px;}
.ph-adv.t1c{color:var(--t1);}
.ph-adv.t2c{color:var(--t2);}
.ph-adv.even{color:var(--muted);}
.ph-desc{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:6px;line-height:1.5;}

/* STRENGTH BARS */
.str-header{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:2px;margin-bottom:12px;}
.str-t1{color:var(--t1);}
.str-t2{color:var(--t2);}
.str-group{margin-bottom:14px;}
.str-ph-lbl{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:6px;}
.str-row{display:flex;align-items:center;gap:8px;}
.sval{font-family:var(--mono);font-size:10px;min-width:32px;}
.bar-wrap{flex:1;height:6px;background:var(--s2);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width .6s ease;}
.bar-t1{background:linear-gradient(90deg,var(--t1d),var(--t1));}
.bar-t2{background:linear-gradient(90deg,var(--t2d),var(--t2));}

/* CONDITIONS */
.cond-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
.cond-block{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:14px;}
.cond-head{font-family:var(--mono);font-size:10px;letter-spacing:2px;margin-bottom:10px;}
.cond-block.t1 .cond-head{color:var(--t1);}
.cond-block.t2 .cond-head{color:var(--t2);}
.cond-item{display:flex;align-items:flex-start;gap:8px;font-family:var(--mono);font-size:11px;color:var(--text);margin-bottom:7px;line-height:1.5;}
.ci{color:var(--gold);flex-shrink:0;}

/* BREAKDOWN */
.bd-panel{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:18px;}
.bd-panel h3{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:14px;}
.bd-grid{display:flex;flex-wrap:wrap;gap:8px;}
.bd-chip{background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;}
.bc-lbl{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1px;}
.bc-val{font-family:var(--mono);font-size:14px;font-weight:600;margin-top:2px;}
.cp{color:var(--green);}.cn{color:var(--t2);}.cy{color:var(--gold);}.cm{color:var(--muted);}

@media(max-width:680px){
  .factors-grid,.pick-grid,.winprob-row,.cond-grid,.phase-timeline{grid-template-columns:1fr;}
  .winprob-vs{display:none;}
}
</style>
</head>
<body>
<div class="page">

<header>
  <div class="logo">DOTA PRO ANALYZER</div>
  <div class="sub">Draft Analysis · Phase Profiles · Win Probability</div>
</header>

<div class="sec-title">Teams</div>
<div class="team-row">
  <div class="team-box t1"><label>TEAM 1</label><input id="t1_name" placeholder="Team Liquid"/></div>
  <div class="vs-badge">VS</div>
  <div class="team-box t2"><label>TEAM 2</label><input id="t2_name" placeholder="OG"/></div>
</div>

<div class="sec-title">Pre-Match Factors</div>
<div class="factors-grid">
  <div class="factor-panel t1">
    <div class="panel-head">// TEAM 1</div>
    <div class="field"><label>Recent Form</label>
      <select id="t1_form"><option value="1">Average</option><option value="2">Good — on a win streak</option><option value="0">Bad — recent losses</option></select></div>
    <div class="field"><label>Tournament Role</label>
      <select id="t1_fav"><option value="0">Regular participant</option><option value="1">Tournament favourite</option><option value="-1">Underdog</option></select></div>
    <div class="field"><label>Roster Status</label>
      <select id="t1_sub"><option value="1">Full roster</option><option value="0">Has stand-in</option></select></div>
  </div>
  <div class="factor-panel t2">
    <div class="panel-head">// TEAM 2</div>
    <div class="field"><label>Recent Form</label>
      <select id="t2_form"><option value="1">Average</option><option value="2">Good — on a win streak</option><option value="0">Bad — recent losses</option></select></div>
    <div class="field"><label>Tournament Role</label>
      <select id="t2_fav"><option value="0">Regular participant</option><option value="1">Tournament favourite</option><option value="-1">Underdog</option></select></div>
    <div class="field"><label>Roster Status</label>
      <select id="t2_sub"><option value="1">Full roster</option><option value="0">Has stand-in</option></select></div>
  </div>
</div>

<div class="sec-title">Hero Picks</div>
<div class="pick-grid">
  <div class="pick-panel t1">
    <div class="panel-head">// TEAM 1 PICK</div>
    <div class="hero-inputs" id="t1_heroes"></div>
    <button class="fetch-btn" onclick="fetchAll('t1')">⟳ FETCH WINRATES (OpenDota 8k+)</button>
    <div class="fetch-status" id="t1_status"></div>
  </div>
  <div class="pick-panel t2">
    <div class="panel-head">// TEAM 2 PICK</div>
    <div class="hero-inputs" id="t2_heroes"></div>
    <button class="fetch-btn" onclick="fetchAll('t2')">⟳ FETCH WINRATES (OpenDota 8k+)</button>
    <div class="fetch-status" id="t2_status"></div>
  </div>
</div>

<div class="analyze-wrap">
  <button class="analyze-btn" onclick="analyze()"><span>ANALYZE DRAFT</span></button>
</div>

<div id="results">
  <div class="sec-title">Win Probability</div>
  <div id="winprob-row" class="winprob-row"></div>
  <div id="winbar-wrap" class="winbar-wrap"></div>

  <div class="sec-title" style="margin-top:8px;">Phase Analysis</div>
  <div class="gameplan-panel">
    <h3>DRAFT BREAKDOWN BY PHASE</h3>
    <div id="phase-timeline" class="phase-timeline"></div>
    <div class="sec-title" style="margin-top:4px;">Pick Strength by Phase</div>
    <div id="strength-bars"></div>
    <div class="sec-title" style="margin-top:16px;">Key Conditions</div>
    <div class="cond-grid" id="cond-grid"></div>
  </div>

  <div class="bd-panel">
    <h3>// SCORE BREAKDOWN</h3>
    <div class="bd-grid" id="bd-grid"></div>
  </div>
</div>

</div>
<script>
// ══ HERO PROFILES ══
const HP = {

// ══ BUILD ROWS ══
function buildHeroRows(){
  ['t1','t2'].forEach(t=>{
    const wrap=document.getElementById(t+'_heroes');
    wrap.innerHTML='';
    for(let i=0;i<5;i++){
      const row=document.createElement('div');
      row.className='hero-row';
      row.innerHTML=`
        <div class="ac-wrap">
          <input type="text" id="${t}_h${i}" placeholder="Hero ${i+1}" autocomplete="off"
            oninput="acInput('${t}',${i})"
            onkeydown="acKey(event,'${t}',${i})"
            onfocus="acInput('${t}',${i})"
            onblur="acBlur('${t}',${i})"/>
          <div class="ac-drop" id="${t}_drop${i}"></div>
        </div>
        <span class="hero-wr" id="${t}_wr${i}">—</span>
        <span class="hero-phase" id="${t}_ph${i}">—</span>`;
      wrap.appendChild(row);
    }
  });
}

const ACN={};
function acInput(t,i){
  const inp=document.getElementById(t+'_h'+i);
  const drop=document.getElementById(t+'_drop'+i);
  const q=inp.value.trim().toLowerCase();
  resetWR(t,i);
  if(!q){drop.classList.remove('open');drop.innerHTML='';return;}
  const matches=ALL_HEROES.filter(h=>h.includes(q)).slice(0,12);
  if(!matches.length){drop.classList.remove('open');drop.innerHTML='';return;}
  ACN[t+i]=-1;
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  drop.innerHTML=matches.map(h=>{
    const hl=h.replace(re,m=>`<b>${m}</b>`);
    const role=(HP[h]||{}).role||'';
    return `<div class="ac-item" data-h="${h}" onmousedown="acPick('${t}',${i},'${h}')">${hl}<span class="ac-role">${role}</span></div>`;
  }).join('');
  drop.classList.add('open');
}
function acBlur(t,i){setTimeout(()=>{const d=document.getElementById(t+'_drop'+i);if(d)d.classList.remove('open');},160);}
function acKey(e,t,i){
  const drop=document.getElementById(t+'_drop'+i);
  const items=[...drop.querySelectorAll('.ac-item')];
  const k=t+i; if(ACN[k]==null)ACN[k]=-1;
  let idx=ACN[k];
  if(e.key==='ArrowDown'){e.preventDefault();idx=Math.min(idx+1,items.length-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();idx=Math.max(idx-1,-1);}
  else if((e.key==='Enter'||e.key==='Tab')&&idx>=0&&items[idx]){e.preventDefault();acPick(t,i,items[idx].dataset.h);return;}
  else if(e.key==='Escape'){drop.classList.remove('open');return;}
  ACN[k]=idx;
  items.forEach((el,mi)=>el.classList.toggle('sel',mi===idx));
}
function acPick(t,i,name){
  document.getElementById(t+'_h'+i).value=cap(name);
  const drop=document.getElementById(t+'_drop'+i);
  drop.classList.remove('open');drop.innerHTML='';
  const ph=document.getElementById(t+'_ph'+i);
  ph.textContent=phLabel(getProf(name));ph.style.color='';
}
function resetWR(t,i){
  document.getElementById(t+'_wr'+i).textContent='—';
  document.getElementById(t+'_wr'+i).style.color='';
  document.getElementById(t+'_ph'+i).textContent='—';
}

// ══ OPENDOTA ══
let cache=null;
async function getStats(){if(cache)return cache;const r=await fetch('https://api.opendota.com/api/heroStats');cache=await r.json();return cache;}
function getHid(name){
  const n=name.trim().toLowerCase();
  if(HID[n]!=null)return HID[n];
  for(const[k,v]of Object.entries(HID))if(k.includes(n)||n.includes(k))return v;
  return null;
}
async function fetchAll(team){
  const st=document.getElementById(team+'_status');
  st.textContent='Fetching…';st.style.color='var(--muted)';
  try{
    const stats=await getStats();let found=0,miss=[];
    for(let i=0;i<5;i++){
      const raw=document.getElementById(team+'_h'+i).value.trim().toLowerCase();
      if(!raw)continue;
      const hid=getHid(raw);
      const wrEl=document.getElementById(team+'_wr'+i);
      const phEl=document.getElementById(team+'_ph'+i);
      if(!hid){wrEl.textContent='?ID';wrEl.style.color='var(--t2)';miss.push(raw);continue;}
      const h=stats.find(s=>s.id===hid);
      if(!h){
        // Hero known in our DB but missing from OpenDota (new/recent hero) — use neutral WR
        if(getProf(raw)){
          wrEl.textContent='~50%';wrEl.style.color='var(--muted)';
          phEl.textContent=phLabel(getProf(raw));found++;
        } else {
          wrEl.textContent='?data';wrEl.style.color='var(--t2)';miss.push(raw);
        }
        continue;
      }
      const wins=h['8_win']||h['pro_win']||0;
      const pick=h['8_pick']||h['pro_pick']||0;
      const wr=(pick>10)?(wins/pick*100):50;  // fallback to 50% if insufficient data
      wrEl.textContent=wr.toFixed(1)+'%';
      wrEl.style.color=wr>=53?'var(--green)':wr<=47?'var(--t2)':'var(--gold)';
      phEl.textContent=phLabel(getProf(raw));found++;
    }
    st.textContent=`✓ ${found} loaded.`+(miss.length?` Unknown: ${miss.join(', ')}`:'');
    st.style.color=miss.length?'var(--gold)':'var(--green)';
  }catch(e){st.textContent='API error.';st.style.color='var(--t2)';}
}

function getProf(name){
  const n=name.trim().toLowerCase();
  if(HP[n])return HP[n];
  for(const[k,v]of Object.entries(HP))if(k.includes(n)||n.includes(k))return v;
  return null;
}
function phLabel(p){
  if(!p)return '?';
  const a=[];if(p.lane>=1)a.push('L');if(p.mid>=1)a.push('M');if(p.late>=1)a.push('K');
  return a.length?a.join('/'):'avg';
}
function collectHeroes(team){
  const out=[];
  for(let i=0;i<5;i++){
    const name=document.getElementById(team+'_h'+i).value.trim().toLowerCase();
    if(!name)continue;
    const wr=parseFloat(document.getElementById(team+'_wr'+i).textContent)||50;
    const profile=getProf(name)||{lane:0,mid:0,late:0,role:'unknown',note:''};
    out.push({name,wr,profile});
  }
  return out;
}
function phScore(heroes,ph){
  let s=0;heroes.forEach(h=>{s+=(h.profile[ph]??0)+((h.wr-50)/100*2);});return s;
}

// ══ PRE-MATCH ══
function preScore(pfx){
  const form=+document.getElementById(pfx+'_form').value;
  const fav= +document.getElementById(pfx+'_fav').value;
  const sub= +document.getElementById(pfx+'_sub').value;
  return ((form-1)*0.35)+(fav*0.25)+((sub-0.5)*0.60);
}

// ══ ANALYZE ══
function analyze(){
  const n1=document.getElementById('t1_name').value||'Team 1';
  const n2=document.getElementById('t2_name').value||'Team 2';
  const pre1=preScore('t1'),pre2=preScore('t2');
  const h1=collectHeroes('t1'),h2=collectHeroes('t2');
  const lane1=phScore(h1,'lane'),lane2=phScore(h2,'lane');
  const mid1=phScore(h1,'mid'),mid2=phScore(h2,'mid');
  const late1=phScore(h1,'late'),late2=phScore(h2,'late');
  const wr1=h1.length?h1.reduce((s,h)=>s+h.wr,0)/h1.length:50;
  const wr2=h2.length?h2.reduce((s,h)=>s+h.wr,0)/h2.length:50;
  const wrB=(wr1-wr2)/100*1.5;
  const draftD=((lane1-lane2)*.3)+((mid1-mid2)*.35)+((late1-late2)*.35);
  const rawD=(pre1-pre2)*.7+draftD*1.5+wrB;
  const delta=rawD/2.5;
  const p1=1/(1+Math.exp(-delta)),p2=1-p1;

  renderWP(n1,n2,p1,p2);
  renderPlan(n1,n2,h1,h2,lane1,lane2,mid1,mid2,late1,late2);
  renderBD(pre1,pre2,draftD,wrB,lane1,lane2,mid1,mid2,late1,late2,rawD,delta,wr1,wr2);

  document.getElementById('results').style.display='block';
  document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'});
}

// ══ RENDER: WIN PROB ══
function renderWP(n1,n2,p1,p2){
  function verdict(p){
    if(p>=0.63)return`<span class="wpc-verdict v-strong">STRONG FAVOURITE</span>`;
    if(p>=0.54)return`<span class="wpc-verdict v-slight">SLIGHT EDGE</span>`;
    if(p>=0.46)return`<span class="wpc-verdict v-even">EVEN MATCH</span>`;
    if(p>=0.37)return`<span class="wpc-verdict v-slight">SLIGHT UNDERDOG</span>`;
    return`<span class="wpc-verdict v-under">SIGNIFICANT UNDERDOG</span>`;
  }
  document.getElementById('winprob-row').innerHTML=`
    <div class="winprob-card t1">
      <div class="wpc-team">${n1.toUpperCase()}</div>
      <div class="wpc-pct">${(p1*100).toFixed(1)}%</div>
      <div class="wpc-label">Win Probability</div>
      ${verdict(p1)}
    </div>
    <div class="winprob-vs">VS</div>
    <div class="winprob-card t2">
      <div class="wpc-team">${n2.toUpperCase()}</div>
      <div class="wpc-pct">${(p2*100).toFixed(1)}%</div>
      <div class="wpc-label">Win Probability</div>
      ${verdict(p2)}
    </div>`;
  document.getElementById('winbar-wrap').innerHTML=`
    <div class="winbar-lbl">
      <span style="color:var(--t1)">${n1}</span>
      <span style="color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:1px">WIN PROBABILITY</span>
      <span style="color:var(--t2)">${n2}</span>
    </div>
    <div class="winbar-track">
      <div class="wb-t1" style="width:${(p1*100).toFixed(1)}%"></div>
      <div class="wb-t2" style="width:${(p2*100).toFixed(1)}%"></div>
    </div>`;
}

// ══ RENDER: GAME PLAN ══
function renderPlan(n1,n2,h1,h2,lane1,lane2,mid1,mid2,late1,late2){
  function phBlock(lbl,time,s1,s2){
    const d=s1-s2;
    let adv,cls,desc;
    if(d>1.0){adv=n1;cls='t1c';desc=`${n1} have a strong structural advantage.`;}
    else if(d>0.4){adv=n1;cls='t1c';desc=`${n1} hold a slight edge.`;}
    else if(d<-1.0){adv=n2;cls='t2c';desc=`${n2} have a strong structural advantage.`;}
    else if(d<-0.4){adv=n2;cls='t2c';desc=`${n2} hold a slight edge.`;}
    else{adv='EVEN';cls='even';desc='Both drafts balanced in this phase.';}
    return`<div class="phase-block">
      <div class="ph-label">${lbl}</div>
      <div class="ph-time">${time}</div>
      <div class="ph-adv ${cls}">${adv}</div>
      <div class="ph-desc">${desc}</div>
    </div>`;
  }
  document.getElementById('phase-timeline').innerHTML=
    phBlock('LANING PHASE','0–12 min',lane1,lane2)+
    phBlock('MID GAME','12–30 min',mid1,mid2)+
    phBlock('LATE GAME','30+ min',late1,late2);

  function nb(v){return Math.min(100,Math.max(0,(v+5)/10*100));}
  document.getElementById('strength-bars').innerHTML=`
    <div class="str-header"><span class="str-t1">${n1.toUpperCase()}</span><span class="str-t2">${n2.toUpperCase()}</span></div>
    ${[['LANING',lane1,lane2],['MID GAME',mid1,mid2],['LATE GAME',late1,late2]].map(([l,v1,v2])=>`
      <div class="str-group">
        <div class="str-ph-lbl">${l}</div>
        <div class="str-row">
          <span class="sval" style="color:var(--t1)">${v1.toFixed(1)}</span>
          <div class="bar-wrap"><div class="bar-fill bar-t1" style="width:${nb(v1)}%"></div></div>
          <div class="bar-wrap"><div class="bar-fill bar-t2" style="width:${nb(v2)}%"></div></div>
          <span class="sval" style="color:var(--t2)">${v2.toFixed(1)}</span>
        </div>
      </div>`).join('')}`;

  function cond(heroes,name,col){
    const earlyH=heroes.filter(h=>h.profile.lane>=1||h.profile.mid>=1);
    const lateH=heroes.filter(h=>h.profile.late>=1);
    const weakL=heroes.filter(h=>h.profile.late<0);
    const items=[];
    if(earlyH.length)items.push(`Early game crucial — ${earlyH.map(h=>cap(h.name)).join(', ')} must win their matchups.`);
    if(lateH.length)items.push(`Late carries: ${lateH.map(h=>cap(h.name)).join(', ')} — protect farm until power spike.`);
    if(weakL.length)items.push(`Must close early: ${weakL.map(h=>cap(h.name)).join(', ')} — avoid going past 35 min.`);
    heroes.forEach(h=>{if(h.profile.note)items.push(`[${cap(h.name)}] ${h.profile.note}`);});
    if(!items.length)items.push('No picks entered yet.');
    return`<div class="cond-block ${col}">
      <div class="cond-head">// ${name.toUpperCase()}</div>
      ${items.map(i=>`<div class="cond-item"><span class="ci">▸</span>${i}</div>`).join('')}
    </div>`;
  }
  document.getElementById('cond-grid').innerHTML=cond(h1,n1,'t1')+cond(h2,n2,'t2');
}

// ══ RENDER: BREAKDOWN ══
function renderBD(pre1,pre2,dD,wrB,lane1,lane2,mid1,mid2,late1,late2,raw,delta,wr1,wr2){
  function chip(l,v,c){return`<div class="bd-chip"><div class="bc-lbl">${l}</div><div class="bc-val ${c}">${v}</div></div>`;}
  function sc(v){return v>0?'cp':v<0?'cn':'cm';}
  function fmt(v){return(v>=0?'+':'')+v.toFixed(2);}
  document.getElementById('bd-grid').innerHTML=
    chip('Pre-match T1',fmt(pre1),sc(pre1))+chip('Pre-match T2',fmt(pre2),sc(-pre2))+
    chip('Draft Δ',fmt(dD),sc(dD))+
    chip('Lane Δ',fmt(lane1-lane2),sc(lane1-lane2))+
    chip('Mid Δ',fmt(mid1-mid2),sc(mid1-mid2))+
    chip('Late Δ',fmt(late1-late2),sc(late1-late2))+
    chip('Avg WR T1',wr1.toFixed(1)+'%',wr1>=52?'cp':wr1<=48?'cn':'cm')+
    chip('Avg WR T2',wr2.toFixed(1)+'%',wr2>=52?'cp':wr2<=48?'cn':'cm')+
    chip('WR Bonus',fmt(wrB),sc(wrB))+
    chip('Raw Δ',fmt(raw),'cy')+
    chip('Calibrated Δ',fmt(delta),'cy');
}

function cap(s){return s.split(' ').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');}
buildHeroRows();
</script>
