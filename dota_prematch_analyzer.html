<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dota Pro Pre-Match Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:       #08090c;
  --s1:       #0e1118;
  --s2:       #141820;
  --border:   #1e2535;
  --t1:       #4fc3f7;
  --t1d:      #0277bd;
  --t2:       #ef5350;
  --t2d:      #b71c1c;
  --gold:     #ffd54f;
  --green:    #69f0ae;
  --muted:    #4a5568;
  --text:     #cdd6f4;
  --mono:     'IBM Plex Mono', monospace;
  --sans:     'IBM Plex Sans', sans-serif;
  --display:  'Bebas Neue', cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* BG grid */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(79,195,247,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,195,247,0.04) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;z-index:0;
}

.page{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:32px 20px 60px;}

/* HEADER */
header{text-align:center;margin-bottom:40px;}
header .logo{
  font-family:var(--display);
  font-size:clamp(32px,6vw,56px);
  letter-spacing:4px;
  background:linear-gradient(135deg,var(--t1) 0%,#ffffff 50%,var(--t2) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1;margin-bottom:6px;
}
header .sub{
  font-family:var(--mono);font-size:11px;
  color:var(--muted);letter-spacing:3px;text-transform:uppercase;
}

/* SECTION TITLE */
.sec-title{
  font-family:var(--mono);font-size:10px;letter-spacing:3px;
  color:var(--muted);text-transform:uppercase;
  margin-bottom:10px;padding-left:2px;
  display:flex;align-items:center;gap:8px;
}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* MARKET ROW */
.market-row{
  display:grid;grid-template-columns:1fr auto 1fr;
  gap:16px;align-items:center;margin-bottom:28px;
}
.market-team{
  background:var(--s1);border:1px solid var(--border);
  border-radius:10px;padding:16px 18px;
}
.market-team label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:2px;display:block;margin-bottom:6px;}
.market-team input{
  width:100%;background:transparent;border:none;outline:none;
  font-family:var(--display);font-size:28px;letter-spacing:2px;color:var(--text);
}
.market-team.t1{border-left:3px solid var(--t1);}
.market-team.t2{border-left:3px solid var(--t2);}
.market-team.t1 input{color:var(--t1);}
.market-team.t2 input{color:var(--t2);}
.vs-badge{
  font-family:var(--display);font-size:22px;letter-spacing:3px;
  color:var(--muted);text-align:center;
}

/* PRE-MATCH FACTORS */
.factors-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px;
}
.factor-panel{
  background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:18px;
}
.factor-panel.t1{border-top:2px solid var(--t1);}
.factor-panel.t2{border-top:2px solid var(--t2);}
.panel-head{
  font-family:var(--mono);font-size:11px;letter-spacing:2px;
  margin-bottom:14px;
}
.t1 .panel-head{color:var(--t1);}
.t2 .panel-head{color:var(--t2);}

.field{margin-bottom:10px;}
.field label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1px;display:block;margin-bottom:4px;}
.field input,.field select{
  width:100%;padding:8px 10px;
  background:var(--s2);border:1px solid var(--border);
  border-radius:6px;color:var(--text);
  font-family:var(--mono);font-size:12px;
  transition:border-color .2s;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--t1);}
.t2 .field input:focus,.t2 .field select:focus{border-color:var(--t2);}

/* HERO PICK SECTION */
.pick-section{margin-bottom:28px;}
.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.pick-panel{
  background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:18px;
}
.pick-panel.t1{border-top:2px solid var(--t1);}
.pick-panel.t2{border-top:2px solid var(--t2);}
.pick-panel .panel-head{font-family:var(--mono);font-size:11px;letter-spacing:2px;margin-bottom:12px;}
.t1.pick-panel .panel-head{color:var(--t1);}
.t2.pick-panel .panel-head{color:var(--t2);}

.hero-inputs{display:flex;flex-direction:column;gap:8px;}
.hero-row{display:flex;gap:8px;align-items:center;}
.hero-row input{
  flex:1;padding:7px 10px;
  background:var(--s2);border:1px solid var(--border);border-radius:6px;
  color:var(--text);font-family:var(--mono);font-size:12px;
  transition:border-color .2s;
}
.hero-row input:focus{outline:none;}
.hero-row .hero-wr{
  min-width:64px;text-align:right;
  font-family:var(--mono);font-size:12px;color:var(--muted);
}
.hero-row .hero-phase{
  min-width:60px;text-align:center;
  font-family:var(--mono);font-size:10px;
  padding:2px 6px;border-radius:4px;
  background:var(--s2);color:var(--muted);border:1px solid var(--border);
}
.fetch-btn{
  margin-top:10px;width:100%;padding:8px;
  background:transparent;border:1px solid var(--border);
  border-radius:6px;color:var(--muted);
  font-family:var(--mono);font-size:11px;letter-spacing:2px;
  cursor:pointer;transition:all .2s;
}
.fetch-btn:hover{border-color:var(--t1);color:var(--t1);}
.t2 .fetch-btn:hover{border-color:var(--t2);color:var(--t2);}
.fetch-status{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:6px;min-height:14px;}

/* ANALYZE BUTTON */
.analyze-wrap{text-align:center;margin:8px 0 32px;}
.analyze-btn{
  padding:16px 60px;
  background:transparent;
  border:1px solid var(--t1);
  border-radius:8px;
  font-family:var(--display);font-size:22px;letter-spacing:4px;
  color:var(--t1);cursor:pointer;
  transition:all .25s;
  position:relative;overflow:hidden;
}
.analyze-btn::before{
  content:'';position:absolute;inset:0;
  background:var(--t1);transform:scaleX(0);transform-origin:left;
  transition:transform .25s ease;
}
.analyze-btn:hover::before{transform:scaleX(1);}
.analyze-btn:hover{color:var(--bg);}
.analyze-btn span{position:relative;z-index:1;}

/* RESULTS */
#results{display:none;}

/* EDGE CARDS */
.edge-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.edge-card{
  background:var(--s1);border:1px solid var(--border);border-radius:10px;
  padding:20px;text-align:center;
}
.edge-card.t1{border-top:3px solid var(--t1);}
.edge-card.t2{border-top:3px solid var(--t2);}
.edge-card .team-name{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:10px;}
.edge-card.t1 .team-name{color:var(--t1);}
.edge-card.t2 .team-name{color:var(--t2);}
.edge-card .model-pct{font-family:var(--display);font-size:52px;letter-spacing:2px;line-height:1;}
.edge-card.t1 .model-pct{color:var(--t1);}
.edge-card.t2 .model-pct{color:var(--t2);}
.edge-card .mkt-line{font-family:var(--mono);font-size:12px;color:var(--muted);margin:6px 0;}
.edge-val-big{font-family:var(--display);font-size:26px;margin-top:8px;}
.edge-pos{color:var(--green);}
.edge-neg{color:var(--t2);}
.edge-neu{color:var(--muted);}
.verdict-tag{
  display:inline-block;margin-top:10px;
  padding:4px 14px;border-radius:20px;
  font-family:var(--mono);font-size:11px;letter-spacing:1px;
}
.v-bet{background:rgba(105,240,174,.12);color:var(--green);border:1px solid rgba(105,240,174,.3);}
.v-skip{background:rgba(74,85,104,.2);color:var(--muted);border:1px solid var(--border);}
.v-fade{background:rgba(239,83,80,.12);color:var(--t2);border:1px solid rgba(239,83,80,.3);}

/* GAME PLAN */
.gameplan-panel{
  background:var(--s1);border:1px solid var(--border);border-radius:10px;
  padding:22px;margin-bottom:20px;
}
.gameplan-panel h3{
  font-family:var(--display);font-size:20px;letter-spacing:3px;
  color:var(--gold);margin-bottom:18px;
}

.phase-timeline{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px;}
.phase-block{
  background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:14px;
  text-align:center;
}
.phase-block .phase-label{
  font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:8px;
}
.phase-block .phase-time{font-family:var(--display);font-size:16px;color:var(--text);margin-bottom:10px;}
.phase-adv{font-family:var(--display);font-size:18px;letter-spacing:1px;}
.phase-adv.t1c{color:var(--t1);}
.phase-adv.t2c{color:var(--t2);}
.phase-adv.even{color:var(--muted);}
.phase-desc{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:6px;line-height:1.5;}

/* PICK STRENGTH BARS */
.strength-section{margin-top:18px;}
.strength-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.strength-row .slbl{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:100px;}
.bar-wrap{flex:1;height:6px;background:var(--s2);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width .6s ease;}
.bar-t1{background:linear-gradient(90deg,var(--t1d),var(--t1));}
.bar-t2{background:linear-gradient(90deg,var(--t2d),var(--t2));}
.strength-row .sval{font-family:var(--mono);font-size:11px;min-width:36px;text-align:right;}

/* CONDITIONS — what to watch in-game */
.conditions-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
.cond-block{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:14px;}
.cond-block .cond-head{font-family:var(--mono);font-size:10px;letter-spacing:2px;margin-bottom:10px;}
.cond-block.t1 .cond-head{color:var(--t1);}
.cond-block.t2 .cond-head{color:var(--t2);}
.cond-item{
  display:flex;align-items:flex-start;gap:8px;
  font-family:var(--mono);font-size:11px;color:var(--text);
  margin-bottom:7px;line-height:1.5;
}
.cond-item .ci{color:var(--gold);flex-shrink:0;}

/* BREAKDOWN */
.breakdown-panel{
  background:var(--s1);border:1px solid var(--border);border-radius:10px;
  padding:18px;
}
.breakdown-panel h3{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:14px;}
.bd-grid{display:flex;flex-wrap:wrap;gap:8px;}
.bd-chip{
  background:var(--s2);border:1px solid var(--border);border-radius:6px;
  padding:8px 12px;
}
.bd-chip .bc-lbl{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1px;}
.bd-chip .bc-val{font-family:var(--mono);font-size:14px;font-weight:600;margin-top:2px;}
.cp{color:var(--green);}
.cn{color:var(--t2);}
.cy{color:var(--gold);}
.cm{color:var(--muted);}

/* HERO LIST in results */
.hero-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.htag{
  font-family:var(--mono);font-size:10px;
  padding:3px 8px;border-radius:4px;
  border:1px solid var(--border);
  background:var(--s2);
}
.htag .hwr{margin-left:4px;font-size:10px;}
.htag.strong{border-color:rgba(105,240,174,.3);color:var(--green);}
.htag.weak{border-color:rgba(239,83,80,.3);color:var(--t2);}
.htag.avg{color:var(--muted);}

@media(max-width:680px){
  .factors-grid,.pick-grid,.edge-row,.conditions-grid,.phase-timeline{grid-template-columns:1fr;}
  .market-row{grid-template-columns:1fr auto 1fr;}
}
</style>
</head>
<body>
<div class="page">

<header>
  <div class="logo">DOTA PRO ANALYZER</div>
  <div class="sub">Pre-Match · Pick Evaluation · Market Edge</div>
</header>

<!-- MARKET PRICES -->
<div class="sec-title">Market Prices</div>
<div class="market-row">
  <div class="market-team t1">
    <label>TEAM 1 NAME</label>
    <input id="t1_name" placeholder="Team Liquid" style="font-family:var(--sans);font-size:18px;font-weight:600;"/>
    <label style="margin-top:12px;">POLYMARKET PRICE</label>
    <input id="t1_price" type="number" step="0.01" min="0.01" max="0.99" placeholder="0.60"/>
  </div>
  <div class="vs-badge">VS</div>
  <div class="market-team t2">
    <label>TEAM 2 NAME</label>
    <input id="t2_name" placeholder="OG" style="font-family:var(--sans);font-size:18px;font-weight:600;"/>
    <label style="margin-top:12px;">POLYMARKET PRICE</label>
    <input id="t2_price" type="number" step="0.01" min="0.01" max="0.99" placeholder="0.40"/>
  </div>
</div>

<!-- PRE-MATCH FACTORS -->
<div class="sec-title">Pre-Match Factors</div>
<div class="factors-grid">
  <div class="factor-panel t1">
    <div class="panel-head">// TEAM 1</div>
    <div class="field">
      <label>Recent Form</label>
      <select id="t1_form">
        <option value="1">Average</option>
        <option value="2">Good — on a win streak</option>
        <option value="0">Bad — recent losses</option>
      </select>
    </div>
    <div class="field">
      <label>Tournament Role</label>
      <select id="t1_fav">
        <option value="0">Regular participant</option>
        <option value="1">Tournament favourite</option>
        <option value="-1">Underdog</option>
      </select>
    </div>
    <div class="field">
      <label>Roster Status</label>
      <select id="t1_sub">
        <option value="1">Full roster</option>
        <option value="0">Has stand-in</option>
      </select>
    </div>
    <div class="field">
      <label>Coach / Analyst Tier</label>
      <select id="t1_coach">
        <option value="1">Average</option>
        <option value="2">Top-tier (known strat innovation)</option>
        <option value="0">Weak / unknown</option>
      </select>
    </div>
  </div>
  <div class="factor-panel t2">
    <div class="panel-head">// TEAM 2</div>
    <div class="field">
      <label>Recent Form</label>
      <select id="t2_form">
        <option value="1">Average</option>
        <option value="2">Good — on a win streak</option>
        <option value="0">Bad — recent losses</option>
      </select>
    </div>
    <div class="field">
      <label>Tournament Role</label>
      <select id="t2_fav">
        <option value="0">Regular participant</option>
        <option value="1">Tournament favourite</option>
        <option value="-1">Underdog</option>
      </select>
    </div>
    <div class="field">
      <label>Roster Status</label>
      <select id="t2_sub">
        <option value="1">Full roster</option>
        <option value="0">Has stand-in</option>
      </select>
    </div>
    <div class="field">
      <label>Coach / Analyst Tier</label>
      <select id="t2_coach">
        <option value="1">Average</option>
        <option value="2">Top-tier (known strat innovation)</option>
        <option value="0">Weak / unknown</option>
      </select>
    </div>
  </div>
</div>

<!-- HERO PICKS -->
<div class="sec-title">Hero Picks (up to 5 heroes per team)</div>
<div class="pick-grid">
  <div class="pick-panel t1">
    <div class="panel-head">// TEAM 1 PICK</div>
    <div class="hero-inputs" id="t1_heroes"></div>
    <button class="fetch-btn" onclick="fetchAll('t1')">⟳ FETCH WINRATES (OpenDota)</button>
    <div class="fetch-status" id="t1_status"></div>
  </div>
  <div class="pick-panel t2">
    <div class="panel-head">// TEAM 2 PICK</div>
    <div class="hero-inputs" id="t2_heroes"></div>
    <button class="fetch-btn" onclick="fetchAll('t2')">⟳ FETCH WINRATES (OpenDota)</button>
    <div class="fetch-status" id="t2_status"></div>
  </div>
</div>

<div class="analyze-wrap" style="margin-top:24px;">
  <button class="analyze-btn" onclick="analyze()"><span>ANALYZE MATCH</span></button>
</div>

<!-- RESULTS -->
<div id="results">
  <div class="sec-title">Model Output</div>

  <!-- EDGE CARDS -->
  <div class="edge-row" id="edge-row"></div>

  <!-- GAME PLAN -->
  <div class="gameplan-panel" id="gameplan-panel">
    <h3>⚡ GAME PLAN</h3>
    <div id="phase-timeline" class="phase-timeline"></div>

    <div class="sec-title" style="margin-top:4px;">Pick Strength by Phase</div>
    <div class="strength-section" id="strength-bars"></div>

    <div class="sec-title" style="margin-top:16px;">What to Watch In-Game</div>
    <div class="conditions-grid" id="conditions-grid"></div>
  </div>

  <!-- BREAKDOWN -->
  <div class="breakdown-panel">
    <h3>// SCORE BREAKDOWN</h3>
    <div class="bd-grid" id="bd-grid"></div>
  </div>
</div>

</div><!-- /page -->

<script>
// ══════════════════════════════════════════════
//  HERO DATABASE — local phase profile per hero
//  laning / mid / late: -1 weak, 0 avg, 1 strong
// ══════════════════════════════════════════════
const HERO_PROFILE = {
  // carries
  "anti-mage":       {lane:0, mid:-1, late:2, role:"carry",   note:"Needs 35+ min, fragile early"},

  "spectre":         {lane:-1,mid:0,  late:2, role:"carry",   note:"Radiance timing ~25 min"},
  "medusa":          {lane:-1,mid:-1, late:2, role:"carry",   note:"Extreme late, needs 40+ min"},
  "terrorblade":     {lane:0, mid:0,  late:2, role:"carry",   note:"Strong at 25+ with BKB"},
  "faceless void":   {lane:0, mid:1,  late:1, role:"carry",   note:"Chrono teamfight mid-game"},
  "lifestealer":     {lane:1, mid:1,  late:0, role:"carry",   note:"Strong laning, falls off late"},
  "wraith king":     {lane:1, mid:0,  late:0, role:"carry",   note:"Tanky lane, mid-game spike"},

  // mids
  "invoker":         {lane:0, mid:1,  late:1, role:"mid",     note:"Scales well, skill-dependent"},

  "shadow fiend":    {lane:1, mid:2,  late:0, role:"mid",     note:"Dominant mid, weak late"},
  "templar assassin":{lane:1, mid:2,  late:0, role:"mid",     note:"Strong lane + early Manta"},

  "puck":            {lane:1, mid:2,  late:0, role:"mid",     note:"Burst + escape early, falls off"},
  "ember spirit":    {lane:0, mid:1,  late:1, role:"mid",     note:"Mobile teamfighter"},

  // offlaners
  "axe":             {lane:2, mid:1,  late:-1,role:"offlane", note:"Call initiator, weak lategame"},
  "tidehunter":      {lane:1, mid:0,  late:1, role:"offlane", note:"Ravage teamfight always relevant"},
  "bristleback":     {lane:2, mid:1,  late:0, role:"offlane", note:"Lane bully, falls off"},
  "centaur warrunner":{lane:1,mid:1,  late:0, role:"offlane", note:"Blink-initiation spike"},
  "mars":            {lane:1, mid:1,  late:0, role:"offlane", note:"Arena wombo, falls lategame"},
  "night stalker":   {lane:0, mid:2,  late:0, role:"offlane", note:"Night phase dominance mid"},

  "timbersaw":       {lane:2, mid:1,  late:-1,role:"offlane", note:"Situational, weak vs ranged late"},
  "dark seer":       {lane:1, mid:0,  late:1, role:"offlane", note:"Ion Shell lane + surge utility"},
  "sand king":       {lane:0, mid:1,  late:0, role:"offlane", note:"Blink-Epicenter wombo"},

// ══════════════════════════════════════════════
//  BUILD HERO INPUT ROWS
// ══════════════════════════════════════════════
function buildHeroRows() {
  ['t1','t2'].forEach(t => {
    const wrap = document.getElementById(t+'_heroes');
    wrap.innerHTML = '';
    for(let i=0;i<5;i++){
      const row = document.createElement('div');
      row.className = 'hero-row';
      row.innerHTML = `
        <input type="text" id="${t}_h${i}" placeholder="Hero ${i+1} name"
               oninput="clearWR('${t}',${i})" autocomplete="off"/>
        <span class="hero-wr" id="${t}_wr${i}">—</span>
        <span class="hero-phase" id="${t}_ph${i}">—</span>
      `;
      wrap.appendChild(row);
    }

}

function clearWR(t,i){
  document.getElementById(t+'_wr'+i).textContent='—';
  document.getElementById(t+'_wr'+i).style.color='';
  document.getElementById(t+'_ph'+i).textContent='—';
}

// ══════════════════════════════════════════════
//  OPENDATA WINRATE FETCH
// ══════════════════════════════════════════════
let heroStatsCache = null;

async function getHeroStats() {
  if(heroStatsCache) return heroStatsCache;
  const res = await fetch('https://api.opendota.com/api/heroStats');
  heroStatsCache = await res.json();
  return heroStatsCache;
}

function getHeroId(name) {
  const n = name.trim().toLowerCase();
  if(HERO_IDS[n] !== undefined) return HERO_IDS[n];
  // fuzzy: find first partial match
  for(const [k,v] of Object.entries(HERO_IDS)){
    if(k.includes(n) || n.includes(k)) return v;
  }
  return null;
}

async function fetchAll(team) {
  const status = document.getElementById(team+'_status');
  status.textContent = 'Fetching from OpenDota…';
  try {
    const stats = await getHeroStats();
    let found=0, missing=[];
    for(let i=0;i<5;i++){
      const name = document.getElementById(team+'_h'+i).value.trim().toLowerCase();
      if(!name) continue;
      const hid = getHeroId(name);
      const wrEl = document.getElementById(team+'_wr'+i);
      const phEl = document.getElementById(team+'_ph'+i);
      if(!hid){
        wrEl.textContent='?ID';wrEl.style.color='#ef5350';
        missing.push(name); continue;
      }
      const h = stats.find(s=>s.id===hid);
      if(!h){ wrEl.textContent='?data';wrEl.style.color='#ef5350'; missing.push(name); continue; }
      // Use 8k+ bracket winrate (pro proxy — best available from OpenDota free)
      const wins = h['8_win'] || h['pro_win'] || 0;
      const pick = h['8_pick'] || h['pro_pick'] || 1;
      const wr = pick>0 ? (wins/pick*100) : 50;
      const wrStr = wr.toFixed(1)+'%';
      wrEl.textContent = wrStr;
      wrEl.style.color = wr>=53 ? '#69f0ae' : wr<=47 ? '#ef5350' : '#ffd54f';
      // phase label from profile
      const profile = getProfile(name);
      phEl.textContent = phaseLabel(profile);
      found++;
    }
    status.textContent = `✓ Loaded ${found} hero(es).` + (missing.length ? ` Unknown: ${missing.join(', ')}` : '');
    status.style.color = missing.length ? '#ffd54f' : '#69f0ae';
  } catch(e) {
    status.textContent = 'API error — check connection.';
    status.style.color = '#ef5350';
  }
}

function getProfile(name) {
  const n = name.trim().toLowerCase();
  if(HERO_PROFILE[n]) return HERO_PROFILE[n];
  for(const [k,v] of Object.entries(HERO_PROFILE)){
    if(k.includes(n)||n.includes(k)) return v;
  }
  return null;
}

function phaseLabel(p){
  if(!p) return '?';
  const phases=[];
  if(p.lane>=1) phases.push('L');
  if(p.mid>=1)  phases.push('M');
  if(p.late>=1) phases.push('K'); // K=late
  return phases.length ? phases.join('/') : 'avg';
}

// ══════════════════════════════════════════════
//  COLLECT HERO DATA
// ══════════════════════════════════════════════
function collectTeamHeroes(team) {
  const heroes = [];
  for(let i=0;i<5;i++){
    const name = document.getElementById(team+'_h'+i).value.trim().toLowerCase();
    if(!name) continue;
    const wrText = document.getElementById(team+'_wr'+i).textContent;
    const wr = parseFloat(wrText) || 50;
    const profile = getProfile(name) || {lane:0,mid:0,late:0,role:'unknown',note:''};
    heroes.push({name, wr, profile});
  }
  return heroes;
}

// Team phase score: sum of phase values + WR adjustment
function phaseScore(heroes, phase) {
  // phase: 'lane' | 'mid' | 'late'
  let score = 0;
  heroes.forEach(h => {
    const phVal = h.profile[phase] ?? 0; // -1,0,1,2
    const wrAdj = (h.wr - 50) / 100 * 2; // small WR adjustment
    score += phVal + wrAdj;
  });
  return score;
}

// ══════════════════════════════════════════════
//  MAIN ANALYZE
// ══════════════════════════════════════════════
function analyze() {
  const n1 = document.getElementById('t1_name').value || 'Team 1';
  const n2 = document.getElementById('t2_name').value || 'Team 2';
  const m1 = parseFloat(document.getElementById('t1_price').value) || 0.5;
  const m2 = parseFloat(document.getElementById('t2_price').value) || 0.5;
  const pm1 = m1/(m1+m2), pm2 = m2/(m1+m2);

  // Pre-match scores
  function preScore(pfx) {
    const form  = +document.getElementById(pfx+'_form').value;   // 0,1,2
    const fav   = +document.getElementById(pfx+'_fav').value;    // -1,0,1
    const sub   = +document.getElementById(pfx+'_sub').value;    // 0,1
    const coach = +document.getElementById(pfx+'_coach').value;  // 0,1,2

    return ((form-1)*0.30) + (fav*0.20) + ((sub-0.5)*0.25*2) + ((coach-1)*0.20);
  }
  const pre1 = preScore('t1');
  const pre2 = preScore('t2');

  // Hero data
  const h1 = collectTeamHeroes('t1');
  const h2 = collectTeamHeroes('t2');

  // Phase scores
  const lane1=phaseScore(h1,'lane'), lane2=phaseScore(h2,'lane');
  const mid1 =phaseScore(h1,'mid'),  mid2 =phaseScore(h2,'mid');
  const late1=phaseScore(h1,'late'), late2=phaseScore(h2,'late');

  // Avg pick WR bonus
  const avgWR1 = h1.length ? h1.reduce((s,h)=>s+h.wr,0)/h1.length : 50;
  const avgWR2 = h2.length ? h2.reduce((s,h)=>s+h.wr,0)/h2.length : 50;
  const wrBonus = (avgWR1 - avgWR2) / 100 * 1.5;

  // Phase-weighted draft score
  // Equal weight across phases — can tune later
  const draftDelta = ((lane1-lane2)*0.30) + ((mid1-mid2)*0.35) + ((late1-late2)*0.35);

  // Total raw delta
  const rawDelta = (pre1-pre2) + draftDelta + wrBonus;
  const delta = rawDelta / 2.5;

  const p1 = 1/(1+Math.exp(-delta));
  const p2 = 1-p1;
  const edge1 = p1-pm1, edge2 = p2-pm2;

  // Kelly
  function kelly(edge,mp){ const b=1/mp-1; return b>0 ? Math.max(0,edge/b*0.5) : 0; }
  const k1=kelly(edge1,pm1), k2=kelly(edge2,pm2);

  // ── RENDER ──
  renderEdgeCards(n1,n2,p1,p2,pm1,pm2,edge1,edge2,k1,k2);
  renderGamePlan(n1,n2,h1,h2,lane1,lane2,mid1,mid2,late1,late2);
  renderBreakdown(pre1,pre2,draftDelta,wrBonus,lane1,lane2,mid1,mid2,late1,late2,rawDelta,delta,avgWR1,avgWR2);

  document.getElementById('results').style.display='block';
  document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'});
}

// ══════════════════════════════════════════════
//  RENDER: EDGE CARDS
// ══════════════════════════════════════════════
function renderEdgeCards(n1,n2,p1,p2,pm1,pm2,e1,e2,k1,k2) {
  function edgeCls(e){ return e>0.04?'edge-pos':e<-0.04?'edge-neg':'edge-neu'; }
  function verdict(e,k) {
    if(e>0.05) return `<span class="verdict-tag v-bet">BET ${(k*100).toFixed(1)}% BANKROLL</span>`;
    if(e>0.02) return `<span class="verdict-tag v-bet">LEAN — small edge</span>`;
    if(e<0) return `<span class="verdict-tag v-fade">FADE / overpriced</span>`;
    return `<span class="verdict-tag v-skip">SKIP — no edge</span>`;
  }
  document.getElementById('edge-row').innerHTML = `
    <div class="edge-card t1">
      <div class="team-name">${n1.toUpperCase()}</div>
      <div class="model-pct">${(p1*100).toFixed(1)}%</div>
      <div class="mkt-line">Market: ${(pm1*100).toFixed(1)}% · Odds: ${(1/pm1).toFixed(2)}x</div>
      <div class="edge-val-big ${edgeCls(e1)}">${e1>=0?'+':''}${(e1*100).toFixed(1)}% EDGE</div>
      ${verdict(e1,k1)}
    </div>
    <div class="edge-card t2">
      <div class="team-name">${n2.toUpperCase()}</div>
      <div class="model-pct">${(p2*100).toFixed(1)}%</div>
      <div class="mkt-line">Market: ${(pm2*100).toFixed(1)}% · Odds: ${(1/pm2).toFixed(2)}x</div>
      <div class="edge-val-big ${edgeCls(e2)}">${e2>=0?'+':''}${(e2*100).toFixed(1)}% EDGE</div>
      ${verdict(e2,k2)}
    </div>
  `;
}

// ══════════════════════════════════════════════
//  RENDER: GAME PLAN
// ══════════════════════════════════════════════
function renderGamePlan(n1,n2,h1,h2,lane1,lane2,mid1,mid2,late1,late2) {
  // Phase advantage
  function phaseBlock(label, timeStr, s1, s2, n1, n2) {
    const diff = s1-s2;
    let advName, cls, desc;
    if(diff>0.5){
      advName=n1;cls='t1c';
      desc=`${n1} expected to have an advantage in this phase.`;
    } else if(diff<-0.5){
      advName=n2;cls='t2c';
      desc=`${n2} expected to have an advantage in this phase.`;
    } else {
      advName='EVEN';cls='even';desc='Phase likely contested — slight edge unclear.';
    }
    return `
      <div class="phase-block">
        <div class="phase-label">${label}</div>
        <div class="phase-time">${timeStr}</div>
        <div class="phase-adv ${cls}">${advName}</div>
        <div class="phase-desc">${desc}</div>
      </div>`;
  }

  document.getElementById('phase-timeline').innerHTML =
    phaseBlock('LANING PHASE','0–12 min',lane1,lane2,n1,n2) +
    phaseBlock('MID GAME','12–30 min',mid1,mid2,n1,n2) +
    phaseBlock('LATE GAME','30+ min',late1,late2,n1,n2);

  // Strength bars
  function normBar(val){ return Math.min(100, Math.max(0, (val+5)/10*100)); }
  document.getElementById('strength-bars').innerHTML = `
    <div class="strength-row">
      <span class="slbl">LANING</span>
      <div class="bar-wrap"><div class="bar-fill bar-t1" style="width:${normBar(lane1)}%"></div></div>
      <span class="sval" style="color:var(--t1)">${lane1.toFixed(1)}</span>
    </div>
    <div class="strength-row">
      <span class="slbl" style="color:var(--t2)">LANING</span>
      <div class="bar-wrap"><div class="bar-fill bar-t2" style="width:${normBar(lane2)}%"></div></div>
      <span class="sval" style="color:var(--t2)">${lane2.toFixed(1)}</span>
    </div>
    <div class="strength-row">
      <span class="slbl">MID GAME</span>
      <div class="bar-wrap"><div class="bar-fill bar-t1" style="width:${normBar(mid1)}%"></div></div>
      <span class="sval" style="color:var(--t1)">${mid1.toFixed(1)}</span>
    </div>
    <div class="strength-row">
      <span class="slbl" style="color:var(--t2)">MID GAME</span>
      <div class="bar-wrap"><div class="bar-fill bar-t2" style="width:${normBar(mid2)}%"></div></div>
      <span class="sval" style="color:var(--t2)">${mid2.toFixed(1)}</span>
    </div>
    <div class="strength-row">
      <span class="slbl">LATE GAME</span>
      <div class="bar-wrap"><div class="bar-fill bar-t1" style="width:${normBar(late1)}%"></div></div>
      <span class="sval" style="color:var(--t1)">${late1.toFixed(1)}</span>
    </div>
    <div class="strength-row">
      <span class="slbl" style="color:var(--t2)">LATE GAME</span>
      <div class="bar-wrap"><div class="bar-fill bar-t2" style="width:${normBar(late2)}%"></div></div>
      <span class="sval" style="color:var(--t2)">${late2.toFixed(1)}</span>
    </div>
  `;

  // CONDITIONS — what to watch
  function buildConditions(heroes, name, color) {
    const earlyHeroes = heroes.filter(h=>h.profile.lane>=1||h.profile.mid>=1);
    const lateHeroes  = heroes.filter(h=>h.profile.late>=1);
    const weakLate    = heroes.filter(h=>h.profile.late<0);
    const items = [];

    if(earlyHeroes.length)
      items.push(`Early game is crucial — ${earlyHeroes.map(h=>cap(h.name)).join(', ')} must win their matchups.`);
    if(lateHeroes.length)
      items.push(`Late game carries: ${lateHeroes.map(h=>cap(h.name)).join(', ')} — protect their farm until power spike.`);
    if(weakLate.length)
      items.push(`Avoid late game: ${weakLate.map(h=>cap(h.name)).join(', ')} — must close before 35 min.`);

    heroes.forEach(h => {
      if(h.profile.note) items.push(`[${cap(h.name)}] ${h.profile.note}`);
    });

    if(!items.length) items.push('No picks entered for this team yet.');

    return `<div class="cond-block ${color}">
      <div class="cond-head">// ${name.toUpperCase()} CONDITIONS</div>
      ${items.map(i=>`<div class="cond-item"><span class="ci">▸</span>${i}</div>`).join('')}
    </div>`;
  }

  document.getElementById('conditions-grid').innerHTML =
    buildConditions(h1, n1, 't1') + buildConditions(h2, n2, 't2');
}

// ══════════════════════════════════════════════
//  RENDER: BREAKDOWN
// ══════════════════════════════════════════════
function renderBreakdown(pre1,pre2,draftDelta,wrBonus,lane1,lane2,mid1,mid2,late1,late2,raw,delta,wr1,wr2) {
  function chip(lbl,val,cls){
    return `<div class="bd-chip"><div class="bc-lbl">${lbl}</div><div class="bc-val ${cls}">${val}</div></div>`;
  }
  function sc(v){ return v>0?'cp':v<0?'cn':'cm'; }
  function fmt(v){ return (v>=0?'+':'')+v.toFixed(2); }

  document.getElementById('bd-grid').innerHTML =
    chip('Pre-match T1', fmt(pre1), sc(pre1)) +
    chip('Pre-match T2', fmt(pre2), sc(-pre2)) +
    chip('Draft Δ (all)', fmt(draftDelta), sc(draftDelta)) +
    chip('Lane Δ', fmt(lane1-lane2), sc(lane1-lane2)) +
    chip('Mid Δ', fmt(mid1-mid2), sc(mid1-mid2)) +
    chip('Late Δ', fmt(late1-late2), sc(late1-late2)) +
    chip('Avg WR T1', wr1.toFixed(1)+'%', wr1>=52?'cp':wr1<=48?'cn':'cm') +
    chip('Avg WR T2', wr2.toFixed(1)+'%', wr2>=52?'cp':wr2<=48?'cn':'cm') +
    chip('WR Bonus', fmt(wrBonus), sc(wrBonus)) +
    chip('Raw Δ', fmt(raw), 'cy') +
    chip('Calibrated Δ', fmt(delta), 'cy');
}

function cap(s){ return s.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' '); }
